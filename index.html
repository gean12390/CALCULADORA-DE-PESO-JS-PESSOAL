<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Peso</title>
    <style>
        body{
            margin: 20px;
        }
        input{
            font-size: 20px;
            padding: 3px;
            margin: 5px;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        #ajuda{
            font-weight: bold;
        }
    </style>
</head>
<body>

    <input type="number" id="quantidade" placeholder="QNTD. DE ESPAÇOS"> 
    <br>
    <input type="number" id="itens_qntd" placeholder="QNTD. DE ITENS"> 
    <br>
    <br>
    <input type="number" placeholder="COD.MATERIAL" id="cod_material"> <input type="button" id="ajuda" value="AJUDA">
    <input type="number" id="resultado" placeholder="RESULTADO P/Kg" readonly>

    <br>
    <br>
    <br>
    <div id="espaco"></div>
    <script src="script.js"></script>
</body>
</html>
